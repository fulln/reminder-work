display_information:
  name: Reminders.work
  description: Deliver scheduled Reminders.work notifications to a selected channel.
  background_color: "#2f5bff"
features:
  bot_user:
    display_name: Reminders.work
    always_online: false
oauth_config:
  redirect_urls:
    - https://reminders.work/integrations/slack/callback
  scopes:
    bot:
      - incoming-webhook
settings:
  incoming_webhooks:
    incoming_webhooks_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
